<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <clipPath id="ab2-clip"><rect width="260" height="260"/></clipPath>
    <!-- eyes and smile are see-through holes, cut out of the head -->
    <mask id="ab2-face" maskUnits="userSpaceOnUse" x="0" y="0" width="260" height="260">
      <rect width="260" height="260" fill="#fff"/>
      <g transform="translate(28 -6) scale(8.5)">
        <circle cx="9" cy="12.2" r="1.45" fill="#000"/>
        <circle cx="15" cy="12.2" r="1.45" fill="#000"/>
        <path d="M8.6 16.3h1.9l.85-1.3 1.2 2.4.85-1.1h2.1" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </mask>
    <clipPath id="ab2-headshape"><rect x="58.6" y="50.1" width="142.8" height="115.6" rx="37.4"/></clipPath>
  </defs>

  <g clip-path="url(#ab2-clip)">
    <!-- ===== body (based on the original, simplified) ===== -->
    <!-- left arm, resting -->
    <path d="M80 204c-10 14-16 32-17 60" fill="none" stroke="#eef3e4" stroke-width="24" stroke-linecap="round"/>
    <path d="M72 212c-7 13-10 30-11 52" fill="none" stroke="#c9d6bf" stroke-width="9" stroke-linecap="round" opacity=".8"/>
    <path d="M64.6 246 63.4 266" stroke="#93a571" stroke-width="24"/>
    <!-- right arm, waving -->
    <path d="M176 214c22 0 38-10 46-30" fill="none" stroke="#eef3e4" stroke-width="22" stroke-linecap="round"/>
    <path d="M178 224c22-2 38-12 46-30" fill="none" stroke="#c9d6bf" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <!-- hand -->
    <g transform="rotate(14 230 160)">
      <circle cx="219" cy="142" r="6.5" fill="#93a571"/>
      <circle cx="230" cy="139" r="6.5" fill="#93a571"/>
      <circle cx="241" cy="142" r="6.5" fill="#93a571"/>
      <rect x="211" y="141" width="38" height="34" rx="14" fill="#93a571"/>
      <path d="M212 166c3 6 9 9 17 9h6c7 0 12-3 14-9" fill="#86996a"/>
    </g>
    <!-- torso -->
    <path d="M78 262c0-52 18-80 54-82 38-2 56 26 56 82z" fill="#9fb893"/>
    <path d="M78 262c0-52 18-80 54-82-22 6-34 30-34 82z" fill="#7f9a6f" opacity=".45"/>
    <path d="M102 262c-2-34 4-58 30-60 28-2 40 18 38 60z" fill="#eef3e4"/>
    <path d="M102 262c-2-34 4-58 30-60-16 6-22 26-20 60z" fill="#c9d6bf" opacity=".9"/>

    <!-- ===== head (same shapes as allubot1.svg, scaled up), tilted a little ===== -->
    <g transform="rotate(-5 130 110)">
    <g transform="translate(28 -6) scale(8.5)">
      <!-- antenna -->
      <rect x="11.2" y="3.6" width="1.6" height="3.4" rx=".8" fill="#eef3e4"/>
      <circle cx="12" cy="2.9" r="1.6" fill="#eef3e4"/>
      <circle cx="11.5" cy="2.4" r=".5" fill="#ffffff" opacity=".7"/>
      <!-- ears -->
      <rect x="1.2" y="10.4" width="2.8" height="5.6" rx="1.3" fill="#eef3e4"/>
      <rect x="20" y="10.4" width="2.8" height="5.6" rx="1.3" fill="#eef3e4"/>
      <path d="M2.6 10.4h-.1a1.3 1.3 0 0 0-1.3 1.3v3a1.3 1.3 0 0 0 1.3 1.3h.1z" fill="#c9d6bf"/>
      <path d="M21.4 10.4h.1a1.3 1.3 0 0 1 1.3 1.3v3a1.3 1.3 0 0 1-1.3 1.3h-.1z" fill="#c9d6bf"/>
    </g>
    <g mask="url(#ab2-face)">
      <g clip-path="url(#ab2-headshape)">
        <rect x="58.6" y="50.1" width="142.8" height="115.6" fill="#eef3e4"/>
        <!-- soft shading, the same idea as the body -->
        <path d="M58.6 50.1h28c-14 12-20 34-20 58s6 46 18 58H58.6z" fill="#c9d6bf" opacity=".75"/>
        <path d="M201.4 136c-8 18-26 30-50 30H58.6v-6c10 4 22 6 34 6h58c22 0 40-12 50-30z" fill="#dfe8d4"/>
      </g>
    </g>
    </g>
  </g>
</svg>
